name = "ddlbuilder"
compatibility_date = "2024-01-01"
main = "dist/server.js"

# 前端静态资源
[assets]
directory = "dist/client"

# KV 命名空间绑定
[[kv_namespaces]]
binding = "SHARE_KV"
id = "ddl-share"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "ddl-llm-rate"

# 环境变量（敏感信息通过 wrangler secret 设置）
[vars]
OPENAI_RATELIMIT_STORE = "kv"

# 路由规则（可选，也可以通过 CF Dashboard 配置）
[[routes]]
pattern = "ddl.xingkaixin.me/*"
custom_domain = true
