<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
<!--定义渐变和阴影-->
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8E7A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E65D4F;stop-opacity:1"/>
    </linearGradient>
  </defs>
<!--图标部分 (左侧)-->
  <g transform="translate(20, 20)">
<!--底部数据块-->
    <path d="M10 50 L60 50 C63 50 65 52 65 55 L65 70 C65 73 63 75 60 75 L10 75 C7 75 5 73 5 70 L5 55 C5 52 7 50 10 50 Z" fill="#E65D4F" opacity="0.6"/>
<!--中间数据块-->
    <path d="M10 25 L60 25 C63 25 65 27 65 30 L65 45 C65 48 63 50 60 50 L10 50 C7 50 5 48 5 45 L5 30 C5 27 7 25 10 25 Z" fill="#E65D4F" opacity="0.8"/>
<!--顶部高亮块 (Header/Construction Block) - 稍微错位以体现"构建"感-->
    <path d="M20 0 L70 0 C73 0 75 2 75 5 L75 20 C75 23 73 25 70 25 L20 25 C17 25 15 23 15 20 L15 5 C15 2 17 0 20 0 Z" fill="url(#primaryGrad)"/>
<!--装饰性元素：右侧的小加号/构建符号-->
    <g transform="translate(75, 50)">
      <rect x="0" y="5" width="14" height="4" rx="2" fill="#E65D4F"/>
      <rect x="5" y="0" width="4" height="14" rx="2" fill="#E65D4F"/>
    </g>
  </g>
</svg>
