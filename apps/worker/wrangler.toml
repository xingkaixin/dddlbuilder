name = "ddlbuilder"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
main = "dist/server.js"


# 前端静态资源
[assets]
directory = "../web/dist/client"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# KV 命名空间绑定
# 本地开发：创建 wrangler.local.toml 并填入实际的 KV ID
# 创建命令：wrangler kv namespace create "ddl-share"
[[kv_namespaces]]
binding = "SHARE_KV"
id = "YOUR_SHARE_KV_ID"

[[d1_databases]]
binding = "USER_DB"
database_name = "ddlbuilder-user-local"
database_id = "00000000-0000-0000-0000-000000000001"
preview_database_id = "00000000-0000-0000-0000-000000000001"

[[durable_objects.bindings]]
name = "WORKSPACE_YDOC"
class_name = "WorkspaceYDocDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceYDocDurableObject"]
