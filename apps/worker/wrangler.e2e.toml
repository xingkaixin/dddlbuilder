name = "ddlbuilder-e2e"
compatibility_date = "2026-03-17"
main = "dist/server.js"

[assets]
directory = "../web/dist/client"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "SHARE_KV"
id = "YOUR_SHARE_KV_ID"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "YOUR_RATE_LIMIT_KV_ID"

[[d1_databases]]
binding = "USER_DB"
database_name = "ddlbuilder-user-e2e"
database_id = "00000000-0000-0000-0000-000000000002"
preview_database_id = "00000000-0000-0000-0000-000000000002"

[[durable_objects.bindings]]
name = "WORKSPACE_YDOC"
class_name = "WorkspaceYDocDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceYDocDurableObject"]

[vars]
CORS_ALLOWED_ORIGINS = "http://127.0.0.1:3000"
BETTER_AUTH_SECRET = "test-better-auth-secret-for-e2e-only"
BETTER_AUTH_URL = "http://127.0.0.1:3000"
RESEND_API_KEY = "test-resend-api-key-for-e2e-only"
RESEND_FROM_EMAIL = "test@example.com"
RESEND_FROM_NAME = "DDLBuilder"
TURNSTILE_SECRET_KEY = "test-turnstile-secret-for-e2e-only"
SIGNUP_BONUS_CREDITS = "10000"
