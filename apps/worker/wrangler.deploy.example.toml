name = "ddlbuilder"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
main = "dist/server.js"

[assets]
directory = "../web/dist/client"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "SHARE_KV"
id = "YOUR_SHARE_KV_ID"

[[d1_databases]]
binding = "USER_DB"
database_name = "YOUR_D1_DATABASE_NAME"
database_id = "YOUR_D1_DATABASE_ID"

[[durable_objects.bindings]]
name = "WORKSPACE_YDOC"
class_name = "WorkspaceYDocDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceYDocDurableObject"]

[vars]
CORS_ALLOWED_ORIGINS = "https://example.com"
BETTER_AUTH_URL = "https://example.com"
RESEND_FROM_EMAIL = "noreply@example.com"
RESEND_FROM_NAME = "DDLBuilder"
SIGNUP_BONUS_CREDITS = "10000"
OPENAI_BASE_URL = "https://api.openai.com/v1"
OPENAI_MODEL_NAME = "gpt-4o-mini"
OPENAI_RATELIMIT_ENABLED = "true"
OPENAI_RATELIMIT_WINDOW_MS = "60000"
OPENAI_RATELIMIT_EXPLAIN_MAX = "15"
OPENAI_RATELIMIT_REVIEW_MAX = "6"
OPENAI_RATELIMIT_GENERATE_MAX = "4"
OPENAI_RETRY_MAX_ATTEMPTS = "3"
OPENAI_RETRY_BASE_DELAY_MS = "400"
OPENAI_RETRY_MAX_DELAY_MS = "3000"
OPENAI_DAILY_BUDGET_ENABLED = "false"
OPENAI_DAILY_BUDGET_MAX_TOKENS = "0"
OPENAI_STREAM_DEBUG = "false"
TELEGRAM_NOTIFY_ENABLED = "false"
CSP_ENABLE = "true"
CSP_MODE = "enforce"
VITE_ENABLE_CNY_FIREWORKS = "false"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 0.1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 0.05
