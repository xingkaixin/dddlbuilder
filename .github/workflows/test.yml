name: Test

on:
  pull_request:
    paths: &code-paths
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!.agents/**'
      # The docs site renders its Markdown, so it still needs CI.
      - 'apps/docs/**'
  push:
    branches:
      - main
    paths: *code-paths

permissions:
  contents: read

# Every main commit gets its own group so release commits are never cancelled or superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Listed first because e2e waits on it; runners are handed out roughly in job order.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-build
          path: |
            apps/web/dist/client
            apps/worker/dist
          if-no-files-found: error
          retention-days: 1

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web 1/2
            command: pnpm --filter @ddlbuilder/web run test --shard=1/2
          - name: web 2/2
            command: pnpm --filter @ddlbuilder/web run test --shard=2/2
          # Mirrors `pnpm test` minus the web package, so new packages are picked up automatically.
          - name: others
            command: pnpm run test:lint && pnpm exec turbo run test --filter='!@ddlbuilder/web' && pnpm run test:scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: ${{ matrix.command }}

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify D1 migrations in Workerd
        run: pnpm run test:runtime

      - name: Validate Cloudflare configuration
        run: pnpm exec tsx scripts/verify-worker-config.ts

      - name: Audit production dependencies
        run: pnpm audit --prod

  test_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-build
          path: apps

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
